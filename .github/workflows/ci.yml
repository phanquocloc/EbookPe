name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dvann" ]
  pull_request:
    branches: [ "main", "dvann" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run Jest Tests
      run: npm test

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dvann'
    
    steps:
      - name: Deploy Placeholder
        run: echo "Deployment is handled automatically by Vercel's GitHub integration after tests pass."
